spring.application.name=scenic-management
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/scenic_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool tuning (production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=ScenicHikariCP

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# NOTE: Do NOT add a global `mybatis-plus.global-config.db-config.logic-delete-field`.
# `status` in this schema is a BUSINESS state field (t_order.status holds
# PAID/CANCELLED/REFUNDED/COMPLETED; t_user.status is 1=enabled/0=disabled),
# NOT a soft-delete marker. Configuring it globally made MyBatis-Plus append
# `WHERE status='1'` to every order query, hiding all orders from every read
# path. If soft delete is ever needed, annotate the specific entity field with
# @TableLogic rather than configuring it here.

server.port=9090

# JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh=604800000
jwt.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# AI config (API key MUST come from the environment - no default value)
nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.base-url=${NVIDIA_API_BASE_URL:https://integrate.api.nvidia.com/v1}
nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
nvidia.embedding-model=${NVIDIA_EMBEDDING_MODEL:}

# Redis config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms

# Cache: Redis-backed (RedisConfig defines the CacheManager and per-cache TTLs).
# This single config file is the ONLY source of truth - application.yml was
# removed because keeping both made the effective value of properties like
# spring.cache.type non-deterministic.
spring.cache.type=redis

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true

# Swagger/OpenAPI disabled by default
springdoc.api-docs.enabled=false

# Scenic business config
scenic.vip-discount=0.8
scenic.max-ticket-quantity=10
scenic.login-max-attempts=5
scenic.login-lock-minutes=10
scenic.register-rate-limit=5
scenic.login-rate-limit=20
scenic.ai-chat-rate-limit=10
scenic.order-timeout-minutes=30
scenic.vip-valid-days=30
scenic.recharge-min-amount=1.00
scenic.recharge-max-amount=10000.00

# Async executor (audit logging)
async.executor.core-pool-size=5
async.executor.max-pool-size=20
async.executor.queue-capacity=100
async.executor.thread-name-prefix=AsyncLog-
async.executor.keep-alive-seconds=60
